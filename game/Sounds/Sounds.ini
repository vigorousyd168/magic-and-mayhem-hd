; Notes:
;
; Sound ID's must range from 1-99999
; They can be in any order, with gaps in the numbering where desired.
; The sound files can now have varying formats (ie some mono, some
; stereo, some 8-bit, some 16-bit, etc.).
;
; Permanent sounds should be those that are used the most. Very small
; sounds. Looping sounds. And large or often used sounds that cannot be
; pre-empted (pre-loaded). The total size of permanent sounds per level
; (at any one time) should be kept to between 124-188 Kb.  When loading
; randomised sounds permenantly, constituent sounds should be in the
; [Load Permenant] header, and not the 1 trigger sound.
;
; Temporary sounds should be those that are used the least, but should
; also all be pre-emptable (pre-loadable).
;

; Sounds 1-400: Creature sounds
; Sounds 401-500: Weapon sounds
; Sounds 501-700: Footfalls/Movement sounds
; Sounds 701-800: Spell sounds
; Sounds 801-900: Interface sounds
; Sounds 901-1000: Weather sounds
; Sounds 1001-1200: Miscellaneous sounds


[Tuning]
MaxSoundDistance=60   ; Radius of audible sound cone (units roughly = 1 tile)
MaxPanDistance=20     ; Radius of differential left/right pan levels (units roughly = 1 tile)
SoundsInDarkness=-65  ; (From -50 to -100) A lower value means sounds are heard louder in the darkness
SingleSoundDistance=5 ; Radius of sound cone where no other sounds of that kind will play (units roughly = 1 tile)

[Optimisation]
MaxSimultaneousSounds=12

