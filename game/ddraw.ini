[ddraw]
; Window client size. 0 0 = borderless fullscreen on the whole monitor.
width=0
height=0
; Size the game renders at; the picture is then scaled to the window.
; Smaller = larger HUD and text, less map on screen.
; 2560 1440 = native, 1920 1080 = HUD x1.33, 1280 720 = HUD x2. 0 0 = native.
renderw=1920
renderh=1080
